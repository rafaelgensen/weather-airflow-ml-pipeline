name: Deploy All - AWS Weather Pipeline

on:
  push:
    branches:
      - 'prod/**'
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy resources?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

env:
  TERRAFORM_DIR: infra/terraform
  AWS_REGION: us-east-1
  ECR_REPO: weather-airflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/prod/') || github.event_name == 'workflow_dispatch'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # TOKEN CHECK CORRIGIDO
      # ------------------------------------------------------
      - name: Validate Databricks Token
        run: |
          echo "Validating Databricks Token..."

          STATUS=$(curl --fail -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
            "${DATABRICKS_HOST}/api/2.0/clusters/list" || echo "FAIL")

          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Invalid Databricks token. HTTP status: $STATUS"
            exit 1
          fi

          echo "Databricks token OK."
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

      # ------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export TF variables
        run: |
          echo "TF_VAR_project_id=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_db_password=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_host=${{ secrets.DATABRICKS_HOST }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_token=${{ secrets.DATABRICKS_TOKEN }}" >> $GITHUB_ENV

      - name: Define image tag and URI
        id: ecr_info
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          REGION=${{ env.AWS_REGION }}
          REPO=${{ env.ECR_REPO }}
          IMAGE_URI="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPO }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPO }}" >/dev/null

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Airflow Image
        run: |
          docker build -t "${IMAGE_URI}" ./airflow
          docker push "${IMAGE_URI}"

      - name: Export image for Terraform
        run: |
          echo "TF_VAR_airflow_image=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply or Destroy
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          if [ "${{ github.event.inputs.destroy }}" == "true" ]; then
            terraform apply -destroy -auto-approve
          else
            terraform apply -auto-approve
          fi

      - name: Register Databricks Instance Profile
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          INSTANCE_PROFILE_ARN=$(terraform -chdir=${{ env.TERRAFORM_DIR }} output -raw databricks_instance_profile_arn 2>/dev/null || true)
          if [ -n "$INSTANCE_PROFILE_ARN" ]; then
            DATABRICKS_HOST="${{ secrets.DATABRICKS_HOST }}"
            DATABRICKS_TOKEN="${{ secrets.DATABRICKS_TOKEN }}"
            curl -s -X POST \
              -H "Authorization: Bearer ${DATABRICKS_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"instance_profile_arn\": \"${INSTANCE_PROFILE_ARN}\"}" \
              "${DATABRICKS_HOST}/api/2.0/instance-profiles/add" || true
          fi

      - name: Force ECS new deployment
        if: ${{ github.event.inputs.destroy != 'true' }}
        run: |
          CLUSTER_NAME=$(terraform -chdir=${{ env.TERRAFORM_DIR }} output -raw ecs_cluster_name 2>/dev/null || true)
          SERVICE_NAME=$(terraform -chdir=${{ env.TERRAFORM_DIR }} output -raw airflow_service_name 2>/dev/null || true)
          if [ -n "$CLUSTER_NAME" ] && [ -n "$SERVICE_NAME" ]; then
            aws ecs update-service \
              --cluster "$CLUSTER_NAME" \
              --service "$SERVICE_NAME" \
              --force-new-deployment
          fi

      - name: Done
        run: echo "Deploy pipeline finished."
