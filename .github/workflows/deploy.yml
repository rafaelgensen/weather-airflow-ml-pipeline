name: Deploy All - AWS Weather Pipeline

on:
  push:
    branches:
      - 'prod/**'
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy resources?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

env:
  TERRAFORM_DIR: infra/terraform
  AWS_REGION: us-east-1
  ECR_REPO: weather-airflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/prod/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      ###########################################################################
      # FULL CLEANUP TOTAL — REMOVE ABSOLUTAMENTE TUDO
      ###########################################################################
      - name: HARD CLEANUP — REMOVE ALL AWS RESOURCES
        run: |
          set +e
          echo "CLEANUP START"

          # ECS — Service → Cluster
          CLUSTERS=$(aws ecs list-clusters --query 'clusterArns[]' --output text)
          for C in $CLUSTERS; do
            SERVICES=$(aws ecs list-services --cluster "$C" --query 'serviceArns[]' --output text)
            for S in $SERVICES; do
              aws ecs update-service --cluster "$C" --service "$S" --desired-count 0 || true
              aws ecs delete-service --cluster "$C" --service "$S" --force || true
            done
            aws ecs delete-cluster --cluster "$C" || true
          done

          # ENIs presas nos SG
          ENIS=$(aws ec2 describe-network-interfaces --query 'NetworkInterfaces[].NetworkInterfaceId' --output text)
          for E in $ENIS; do
            aws ec2 delete-network-interface --network-interface-id "$E" || true
          done

          # SG airflow
          SGIDS=$(aws ec2 describe-security-groups --query 'SecurityGroups[].GroupId' --output text)
          for SG in $SGIDS; do
            aws ec2 delete-security-group --group-id "$SG" || true
          end

          # RDS
          aws rds delete-db-instance --db-instance-identifier airflow-db --skip-final-snapshot || true
          aws rds delete-db-subnet-group --db-subnet-group-name airflow-default-subnets || true

          # Lambda
          aws lambda delete-function --function-name ingest-weather-api || true

          # S3 buckets
          for B in raw-weather-* processed-weather-* ml-output-weather-*; do
            aws s3 rb s3://$B --force || true
          done

          # IAM — detach + delete roles
          ROLE_LIST="ecsTaskExecutionRole airflow-task-role lambda-ingest-role databricks-instance-profile"
          for R in $ROLE_LIST; do
            POLS=$(aws iam list-attached-role-policies --role-name "$R" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null)
            for P in $POLS; do
              aws iam detach-role-policy --role-name "$R" --policy-arn "$P" || true
            done
            aws iam delete-role --role-name "$R" || true
          done

          # IAM — delete policies
          POLICY_LIST="airflow-access-policy lambda-ingest-policy databricks-s3-access"
          for PN in $POLICY_LIST; do
            ARN=$(aws iam list-policies --scope Local --query "Policies[?PolicyName=='$PN'].Arn" --output text)
            if [ "$ARN" != "None" ]; then aws iam delete-policy --policy-arn "$ARN" || true; fi
          done

          # Logs
          aws logs delete-log-group --log-group-name /ecs/airflow || true

          echo "CLEANUP FINISHED"
          set -e


      ###########################################################################
      # CONTINUA COM EXPORT TF VARS / BUILD IMAGE / DEPLOY NORMAL
      ###########################################################################

      - name: Export TF variables
        run: |
          echo "TF_VAR_project_id=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_db_password=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_host=${{ secrets.DATABRICKS_HOST }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_token=${{ secrets.DATABRICKS_TOKEN }}" >> $GITHUB_ENV

      - name: Define image tag and URI
        id: ecr_info
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          REGION=${{ env.AWS_REGION }}
          REPO=${{ env.ECR_REPO }}
          IMAGE_URI="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPO }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPO }}" >/dev/null

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Airflow Image
        run: |
          docker build -t "${IMAGE_URI}" ./airflow
          docker push "${IMAGE_URI}"

      - name: Export image for Terraform
        run: |
          echo "TF_VAR_airflow_image=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve
