name: Deploy All - AWS Weather Pipeline

on:
  push:
    branches:
      - 'prod/**'
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy resources?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

env:
  TERRAFORM_DIR: infra/terraform
  AWS_REGION: us-east-1
  ECR_REPO: weather-airflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export TF vars
        run: |
          echo "TF_VAR_project_id=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_db_password=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_host=${{ secrets.DATABRICKS_HOST }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_token=${{ secrets.DATABRICKS_TOKEN }}" >> $GITHUB_ENV

      #####################################################################
      # DESTROY TRIGGER: workflow_dispatch OR commit contains [DESTROY]
      #####################################################################
      - name: Detect destroy flag
        id: destroy_check
        run: |
          MSG="${{ github.event.head_commit.message }}"
          INPUT="${{ github.event.inputs.destroy }}"

          if [[ "$INPUT" == "true" ]]; then
            echo "RUN_DESTROY=true" >> $GITHUB_ENV
          elif echo "$MSG" | grep -qi "\[DESTROY\]"; then
            echo "RUN_DESTROY=true" >> $GITHUB_ENV
          else
            echo "RUN_DESTROY=false" >> $GITHUB_ENV
          fi

      - name: Show destroy decision
        run: |
          echo "RUN_DESTROY = ${{ env.RUN_DESTROY }}"

      #####################################################################
      # DESTROY IF NEEDED
      #####################################################################
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Terraform Destroy
        if: env.RUN_DESTROY == 'true'
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform destroy -auto-approve

      #####################################################################
      # STOP THE PIPELINE AFTER DESTROY
      #####################################################################
      - name: Stop after destroy
        if: env.RUN_DESTROY == 'true'
        run: exit 0

      #####################################################################
      # NORMAL APPLY (only when NOT destroying)
      #####################################################################
      - name: Define image tag and URI
        id: ecr_info
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
          IMAGE_URI="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPO }}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Ensure ECR repo exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPO }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPO }}" >/dev/null

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Airflow Image
        run: |
          docker build -t "${IMAGE_URI}" ./airflow
          docker push "${IMAGE_URI}"

      - name: Export image for TF
        run: |
          echo "TF_VAR_airflow_image=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve

      - name: Done
        run: echo "Pipeline finished."
