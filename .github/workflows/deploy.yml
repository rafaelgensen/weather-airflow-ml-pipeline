name: Deploy All - AWS Weather Pipeline

on:
  push:
    branches:
      - 'prod/**'
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy resources?"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: read

env:
  TERRAFORM_DIR: infra/terraform
  AWS_REGION: us-east-1
  ECR_REPO: weather-airflow

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/prod/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      - name: Full Cleanup (Force Delete AWS Resources)
        if: ${{ github.event.inputs.destroy == 'true' }}
        run: |
          echo "Starting full cleanup..."

          set -e

          # -------------------------
          # ECS SERVICE + CLUSTER
          # -------------------------
          SERVICE_NAME="airflow-service"
          CLUSTER_NAME="airflow-cluster"

          if aws ecs describe-services --cluster "$CLUSTER_NAME" --services "$SERVICE_NAME" 2>/dev/null | grep -q '"status":'; then
            aws ecs update-service --cluster "$CLUSTER_NAME" --service "$SERVICE_NAME" --desired-count 0 || true
            sleep 10
            aws ecs delete-service --cluster "$CLUSTER_NAME" --service "$SERVICE_NAME" --force || true
          fi

          if aws ecs describe-clusters --clusters "$CLUSTER_NAME" 2>/dev/null | grep -q '"status":'; then
            aws ecs delete-cluster --cluster "$CLUSTER_NAME" || true
          fi

          # -------------------------
          # DELETE ECS TASK DEFINITIONS
          # -------------------------
          for REV in $(aws ecs list-task-definitions --family-prefix airflow --query "taskDefinitionArns[]" --output text); do
            aws ecs deregister-task-definition --task-definition "$REV" || true
          done

          # -------------------------
          # RDS DELETE
          # -------------------------
          aws rds delete-db-instance \
            --db-instance-identifier airflow-db \
            --skip-final-snapshot || true

          # -------------------------
          # LOG GROUP
          # -------------------------
          aws logs delete-log-group --log-group-name "/ecs/airflow" || true

          # -------------------------
          # SECURITY GROUPS
          # -------------------------
          SG_IDS=$(aws ec2 describe-security-groups --query "SecurityGroups[?GroupName=='airflow-ecs-sg'].GroupId" --output text)
          for SG in $SG_IDS; do
            aws ec2 delete-security-group --group-id "$SG" || true
          done

          SG_IDS2=$(aws ec2 describe-security-groups --query "SecurityGroups[?GroupName=='airflow-db-sg'].GroupId" --output text)
          for SG in $SG_IDS2; do
            aws ec2 delete-security-group --group-id "$SG" || true
          done

          # -------------------------
          # NETWORK INTERFACES (ENIs)
          # -------------------------
          ENIS=$(aws ec2 describe-network-interfaces \
            --filters "Name=description,Values=AWS Fargate ENI*" \
            --query "NetworkInterfaces[].NetworkInterfaceId" \
            --output text)

          for ENI in $ENIS; do
            aws ec2 detach-network-interface --attachment-id \
              $(aws ec2 describe-network-interfaces --network-interface-ids $ENI --query "NetworkInterfaces[0].Attachment.AttachmentId" --output text) || true
            sleep 3
            aws ec2 delete-network-interface --network-interface-id $ENI || true
          done

          # -------------------------
          # S3 BUCKETS
          # -------------------------
          aws s3 rb s3://raw-weather-${{ secrets.AWS_ACCOUNT_ID }} --force || true
          aws s3 rb s3://processed-weather-${{ secrets.AWS_ACCOUNT_ID }} --force || true
          aws s3 rb s3://ml-output-weather-${{ secrets.AWS_ACCOUNT_ID }} --force || true

          # -------------------------
          # IAM ROLES + POLICIES
          # -------------------------
          POLICIES=(
            "airflow-access-policy"
            "lambda-ingest-policy"
            "databricks-s3-access"
          )

          for P in "${POLICIES[@]}"; do
            ARN="arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:policy/$P"
            ATTACHED=$(aws iam list-entities-for-policy --policy-arn "$ARN" --query "PolicyRoles[].RoleName" --output text || true)
            for ROLE in $ATTACHED; do
              aws iam detach-role-policy --role-name "$ROLE" --policy-arn "$ARN" || true
            done
            aws iam delete-policy --policy-arn "$ARN" || true
          done

          ROLES=(
            "ecsTaskExecutionRole"
            "airflow-task-role"
            "lambda-ingest-role"
            "databricks-instance-profile"
          )

          for R in "${ROLES[@]}"; do
            # detach inline policies
            POLS=$(aws iam list-attached-role-policies --role-name "$R" --query "AttachedPolicies[].PolicyArn" --output text || true)
            for PA in $POLS; do
              aws iam detach-role-policy --role-name "$R" --policy-arn "$PA" || true
            done
            aws iam delete-role --role-name "$R" || true
          done

          echo "Cleanup finished."


      ###########################################################################
      # CONTINUA COM EXPORT TF VARS / BUILD IMAGE / DEPLOY NORMAL
      ###########################################################################

      - name: Export TF variables
        run: |
          echo "TF_VAR_project_id=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_db_password=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_host=${{ secrets.DATABRICKS_HOST }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_token=${{ secrets.DATABRICKS_TOKEN }}" >> $GITHUB_ENV

      - name: Define image tag and URI
        id: ecr_info
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          REGION=${{ env.AWS_REGION }}
          REPO=${{ env.ECR_REPO }}
          IMAGE_URI="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPO }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPO }}" >/dev/null

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Airflow Image
        run: |
          docker build -t "${IMAGE_URI}" ./airflow
          docker push "${IMAGE_URI}"

      - name: Export image for Terraform
        run: |
          echo "TF_VAR_airflow_image=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve
