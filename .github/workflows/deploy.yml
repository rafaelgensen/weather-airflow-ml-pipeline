name: Deploy All - AWS Weather Pipeline

on:
  push:
    branches:
      - 'prod/**'
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destroy resources first?"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

env:
  TERRAFORM_DIR: infra/terraform
  AWS_REGION: us-east-1
  ECR_REPO: weather-airflow

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Export TF variables
        run: |
          echo "TF_VAR_project_id=${{ secrets.AWS_ACCOUNT_ID }}" >> $GITHUB_ENV
          echo "TF_VAR_region=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "TF_VAR_db_password=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_host=${{ secrets.DATABRICKS_HOST }}" >> $GITHUB_ENV
          echo "TF_VAR_databricks_token=${{ secrets.DATABRICKS_TOKEN }}" >> $GITHUB_ENV

      - name: Define image tag and URI
        id: ecr_info
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-8)
          ACCOUNT=${{ secrets.AWS_ACCOUNT_ID }}
          REGION=${{ env.AWS_REGION }}
          REPO=${{ env.ECR_REPO }}
          IMAGE_URI="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${REPO}:${SHORT_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ env.ECR_REPO }}" >/dev/null 2>&1 || \
            aws ecr create-repository --repository-name "${{ env.ECR_REPO }}" >/dev/null

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} \
            | docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

      - name: Build and Push Airflow Image
        run: |
          docker build -t "${IMAGE_URI}" ./airflow
          docker push "${IMAGE_URI}"

      - name: Export image for Terraform
        run: |
          echo "TF_VAR_airflow_image=${IMAGE_URI}" >> $GITHUB_ENV

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform init -input=false

      ###############################################################
      #   FULL CLEANUP BEFORE APPLY (THE CORRECT, DOCUMENTED WAY)   #
      ###############################################################

      - name: Remove drifted resources from state
        if: ${{ github.event.inputs.destroy == 'true' }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform state rm module.airflow.aws_cloudwatch_log_group.airflow || true
          terraform state rm module.airflow.aws_security_group.airflow_ecs || true
          terraform state rm module.airflow.aws_db_subnet_group.default_subnets || true
          terraform state rm module.s3.aws_s3_bucket.raw || true
          terraform state rm module.s3.aws_s3_bucket.processed || true
          terraform state rm module.s3.aws_s3_bucket.ml_output || true
          terraform state rm module.iam.aws_iam_role.ecs_execution_role || true
          terraform state rm module.iam.aws_iam_role.airflow_task_role || true
          terraform state rm module.iam.aws_iam_role.lambda_role || true
          terraform state rm module.iam.aws_iam_role.databricks_instance_profile || true
          terraform state rm module.iam.aws_iam_policy.airflow_policy || true
          terraform state rm module.iam.aws_iam_policy.lambda_policy || true
          terraform state rm module.iam.aws_iam_policy.databricks_s3_policy || true

      - name: Terraform Destroy All
        if: ${{ github.event.inputs.destroy == 'true' }}
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform destroy -auto-approve

      ###############################################
      #                   APPLY                     #
      ###############################################

      - name: Terraform Apply
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: terraform apply -auto-approve

      - name: Done
        run: echo "Finished."
